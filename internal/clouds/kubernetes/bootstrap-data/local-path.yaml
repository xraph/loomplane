apiVersion: v1
kind: ServiceAccount
metadata:
  name: loomplane-local-path-service-account
  namespace: loomplane-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loomplane-local-path-role
  namespace: loomplane-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: loomplane-local-path-role
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loomplane-local-path-bind
  namespace: loomplane-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loomplane-local-path-role
subjects:
  - kind: ServiceAccount
    name: loomplane-local-path-service-account
    namespace: loomplane-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loomplane-local-path-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: loomplane-local-path-role
subjects:
  - kind: ServiceAccount
    name: loomplane-local-path-service-account
    namespace: loomplane-system

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loomplane-local-path
  namespace: loomplane-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loomplane-local-path
  template:
    metadata:
      labels:
        app: loomplane-local-path
    spec:
      serviceAccountName: loomplane-local-path-service-account
      containers:
        - name: loomplane-local-path
          image: docker.io/rancher/local-path-provisioner:v0.0.37@sha256:e757967a5ec338f6a9b371c5a9688bedaa8c3578ea3dd4db329ea0084be0a86f
          imagePullPolicy: IfNotPresent
          command:
            - local-path-provisioner
            - start
            - --service-account-name=loomplane-local-path-service-account
            - --configmap-name=loomplane-local-path-config
            - --provisioner-name=loomplane.io/local-path
            - --helper-image=docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
            - --config
            - /etc/config/config.json
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_MOUNT_PATH
              value: /etc/config/
            - name: HEALTH_PORT
              value: "8080"
      volumes:
        - name: config-volume
          configMap:
            name: loomplane-local-path-config

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: lp-local-retained
provisioner: loomplane.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain

---
kind: ConfigMap
apiVersion: v1
metadata:
  name: loomplane-local-path-config
  namespace: loomplane-system
data:
  config.json: |-
    {
            "nodePathMap":[
            {
                    "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
                    "paths":["/opt/loomplane-local-path"]
            }
            ]
    }
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
      - name: helper-pod
        image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
        imagePullPolicy: IfNotPresent
