# Loomplane as a Miget Compose Stack. Point the stack at this directory
# (compose path `deployments/miget`); Miget layers compose.miget.yaml on top.
# Plain `docker compose up` ignores that overlay and runs everything locally
# in development mode, which is how you try the stack before deploying it.
# See docs/miget.md.
#
# Miget builds both apps from the repository's Dockerfile, so you don't need
# a published image. It runs each service as its own app and drops
# `entrypoint:` and `command:`, so LOOMPLANE_PROCESS picks the worker.
name: loomplane

x-build: &build
  context: ../..
  dockerfile: deployments/docker/Dockerfile

x-environment: &environment
  LOOMPLANE_ENVIRONMENT: development
  LOOMPLANE_PUBLIC_URL: http://localhost:5000
  # Required. Miget asks for it once and gives both apps the same value.
  # It must be 32 random bytes, base64: openssl rand -base64 32
  LOOMPLANE_SECRET_KEY: ${LOOMPLANE_SECRET_KEY}
  LOOMPLANE_DATABASE_URL: postgres://loomplane:loomplane-local-only@db:5432/loomplane?sslmode=disable

services:
  loomplane:
    build: *build
    restart: unless-stopped
    environment:
      <<: *environment
      LOOMPLANE_PROCESS: api
      # Miget's ingress only reaches port 5000.
      LOOMPLANE_HTTP_ADDR: ":5000"
    ports:
      - "5000:5000"
    volumes:
      - artifacts:/var/lib/loomplane
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO, /dev/null, "http://127.0.0.1:5000/_/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  loomplane-worker:
    build: *build
    restart: unless-stopped
    environment:
      <<: *environment
      LOOMPLANE_PROCESS: worker
      LOOMPLANE_WORKER_HTTP_ADDR: ":8781"
    # The API migrates the database the worker uses.
    depends_on:
      loomplane:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO, /dev/null, "http://127.0.0.1:8781/_/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # A container here; a managed PostgreSQL on Miget.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: loomplane
      POSTGRES_PASSWORD: loomplane-local-only
      POSTGRES_DB: loomplane
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U loomplane -d loomplane"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  artifacts:
  dbdata:
