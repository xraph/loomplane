# Miget layers this onto compose.yaml at deploy time. Plain docker compose
# ignores it. Reference: https://docs.miget.com/deployments/docker-compose-stacks
x-production: &production
  LOOMPLANE_ENVIRONMENT: production
  LOOMPLANE_PUBLIC_URL: ${{loomplane.public_url}}
  LOOMPLANE_DATABASE_URL: ${{db.url}}

services:
  # Idle use is around 50 MiB for the API and 100 MiB for the worker; the
  # worker needs the headroom while it analyzes a repository.
  loomplane:
    x-miget:
      ram: "512Mi"
    environment: *production

  loomplane-worker:
    x-miget:
      ram: "512Mi"
      private: true
    environment: *production

  db:
    x-miget:
      managed: postgres
      cpu: "250m"
      ram: "512Mi"
      storage: "2Gi"

volumes:
  artifacts:
    x-miget: { size: "2Gi", type: RWO }
