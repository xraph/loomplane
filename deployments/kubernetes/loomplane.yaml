# Source: loomplane/templates/api-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loomplane
  labels:
    helm.sh/chart: loomplane-0.1.0
    app.kubernetes.io/name: loomplane
    app.kubernetes.io/instance: loomplane
    app.kubernetes.io/version: "main"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: loomplane
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: loomplane
      app.kubernetes.io/instance: loomplane
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: e435b803e940df61b3e59b907d47c252a433abfc4fa65a983d8934781b797cf0
      labels:
        app.kubernetes.io/name: loomplane
        app.kubernetes.io/instance: loomplane
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: loomplane
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # One pod migrates under a Postgres lock; the others wait for it and
        # find nothing left. A failure here holds the rollout, and the pods
        # already running keep serving.
        - name: migrate
          image: ghcr.io/xraph/loomplane:main
          imagePullPolicy: Always
          args: [migrate]
          env:
            - name: LOOMPLANE_PROCESS
              value: api
          envFrom:
            - configMapRef:
                name: loomplane
            - secretRef:
                name: loomplane
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: api
          image: ghcr.io/xraph/loomplane:main
          imagePullPolicy: Always
          env:
            - name: LOOMPLANE_PROCESS
              value: api
          envFrom:
            - configMapRef:
                name: loomplane
            - secretRef:
                name: loomplane
          ports:
            - name: http
              containerPort: 8780
              protocol: TCP
          # The port opens once migrations and every extension have started.
          startupProbe:
            httpGet:
              path: /_/health/live
              port: http
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /_/health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_/health/ready
              port: http
            initialDelaySeconds: 65
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Keep serving while the endpoint removal reaches every
                # proxy, then let SIGTERM drain what's in flight.
                command: [sleep, "10"]
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
      topologySpreadConstraints:
        
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: loomplane
              app.kubernetes.io/instance: loomplane
              app.kubernetes.io/component: api
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: loomplane
              app.kubernetes.io/instance: loomplane
              app.kubernetes.io/component: api

