# Source: loomplane/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loomplane
  labels:
    helm.sh/chart: loomplane-0.1.0
    app.kubernetes.io/name: loomplane
    app.kubernetes.io/instance: loomplane
    app.kubernetes.io/version: "main"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: loomplane
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - loomplane.example.com
      secretName: loomplane-tls
  rules:
    - host: "loomplane.example.com"
      http:
        paths:
          - path: /_/health
            pathType: Prefix
            backend:
              service:
                name: loomplane-blocked
                port:
                  name: http
          - path: /_/metrics
            pathType: Prefix
            backend:
              service:
                name: loomplane-blocked
                port:
                  name: http
          - path: /debug
            pathType: Prefix
            backend:
              service:
                name: loomplane-blocked
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loomplane
                port:
                  name: http
