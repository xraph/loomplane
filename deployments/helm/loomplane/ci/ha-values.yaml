# CI renders the chart with these to lint and validate it. They aren't a
# working install: nothing listens at these addresses.
publicURL: https://loomplane.example.com
secrets:
  secretKey: Y2ktb25seS1ub3QtYS1yZWFsLWtleS0zMi1ieXRlcyE=
  databaseURL: postgres://loomplane:ci@postgres:5432/loomplane?sslmode=require
storage:
  url: s3://us-east-1/loomplane?endpoint=http://minio:9000&path_style=true
notifications:
  smtpHost: smtp.example.com
  from: loomplane@example.com
database:
  poolSize: 24
configFile: |
  orchestration:
    poll_interval: 2s
api:
  autoscaling:
    enabled: true
worker:
  autoscaling:
    enabled: true
ingress:
  enabled: true
  className: nginx
  tls:
    - secretName: loomplane-tls
      hosts: [loomplane.example.com]
httpRoute:
  enabled: true
  parentRefs:
    - name: public
      namespace: gateway
metrics:
  serviceMonitor:
    enabled: true
extraVolumes:
  - name: spire-agent-socket
    csi:
      driver: csi.spiffe.io
      readOnly: true
extraVolumeMounts:
  - name: spire-agent-socket
    mountPath: /run/spire/agent-sockets
    readOnly: true
