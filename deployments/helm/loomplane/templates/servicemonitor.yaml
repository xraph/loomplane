{{- if .Values.metrics.serviceMonitor.enabled }}
{{- range $component := list "api" "worker" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ if eq $component "api" }}{{ include "loomplane.fullname" $ }}{{ else }}{{ include "loomplane.workerName" $ }}{{ end }}
  labels:
    {{- include "loomplane.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
    {{- with $.Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "loomplane.selectorLabels" (dict "ctx" $ "component" $component) | nindent 6 }}
  endpoints:
    - port: http
      path: /_/metrics
      interval: {{ $.Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ $.Values.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}
{{- end }}
