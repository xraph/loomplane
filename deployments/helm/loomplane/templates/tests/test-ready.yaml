apiVersion: v1
kind: Pod
metadata:
  name: {{ include "loomplane.fullname" . }}-test-ready
  labels:
    {{- include "loomplane.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: ready
      image: {{ include "loomplane.image" . }}
      imagePullPolicy: {{ include "loomplane.pullPolicy" . }}
      # Through the Service, so it passes only when a ready pod answers.
      command:
        - /bin/sh
        - -c
        - wget -qO- http://{{ include "loomplane.fullname" . }}:{{ .Values.service.port }}/_/health/ready
      securityContext:
        {{- toYaml .Values.containerSecurityContext | nindent 8 }}
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
