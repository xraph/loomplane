{{- $component := dict "ctx" $ "component" "api" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loomplane.fullname" . }}
  labels:
    {{- include "loomplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    {{- toYaml .Values.api.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "loomplane.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "loomplane.checksums" . | nindent 8 }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "loomplane.selectorLabels" $component | nindent 8 }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "loomplane.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.migrations.enabled }}
      initContainers:
        # One pod migrates under a Postgres lock; the others wait for it and
        # find nothing left. A failure here holds the rollout, and the pods
        # already running keep serving.
        - name: migrate
          image: {{ include "loomplane.image" . }}
          imagePullPolicy: {{ include "loomplane.pullPolicy" . }}
          args: [migrate]
          env:
            - name: LOOMPLANE_PROCESS
              value: api
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            {{- include "loomplane.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            {{- include "loomplane.volumeMounts" . | nindent 12 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "loomplane.image" . }}
          imagePullPolicy: {{ include "loomplane.pullPolicy" . }}
          env:
            - name: LOOMPLANE_PROCESS
              value: api
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            {{- include "loomplane.envFrom" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8780
              protocol: TCP
          # The port opens once migrations and every extension have started.
          startupProbe:
            httpGet:
              path: /_/health/live
              port: http
            periodSeconds: {{ .Values.api.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /_/health/live
              port: http
            periodSeconds: {{ .Values.api.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /_/health/ready
              port: http
            initialDelaySeconds: {{ .Values.api.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.readiness.failureThreshold }}
          {{- if .Values.api.preStopSleepSeconds }}
          lifecycle:
            preStop:
              exec:
                # Keep serving while the endpoint removal reaches every
                # proxy, then let SIGTERM drain what's in flight.
                command: [sleep, {{ .Values.api.preStopSleepSeconds | quote }}]
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            {{- include "loomplane.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "loomplane.volumes" (dict "ctx" $ "tmpSize" .Values.api.tmpSize) | nindent 8 }}
      topologySpreadConstraints:
        {{- include "loomplane.topologySpread" (dict "ctx" $ "component" "api" "constraints" .Values.api.topologySpreadConstraints) | nindent 8 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
