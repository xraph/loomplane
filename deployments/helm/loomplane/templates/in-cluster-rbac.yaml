{{- if .Values.inCluster.enabled }}
{{- /*
What a Kubernetes connection's check asks for (internal/clouds/kubernetes),
granted to Loomplane's service account in each namespace it may deploy
into. Roles and RoleBindings are there because Loomplane gives services
that discover each other a Role of their own; Kubernetes lets it grant only
what it holds itself.
*/ -}}
{{- $sa := include "loomplane.serviceAccountName" . -}}
{{- range $namespace := .Values.inCluster.namespaces }}
{{- if $.Values.inCluster.createNamespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  labels:
    {{- include "loomplane.labels" $ | nindent 4 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "loomplane.fullname" $ }}-deployer
  namespace: {{ $namespace }}
  labels:
    {{- include "loomplane.labels" $ | nindent 4 }}
rules:
  # The namespace itself: Loomplane pins its UID.
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [{{ $namespace | quote }}]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [services/proxy]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, create, update, delete]
  - apiGroups: [""]
    resources: [endpoints]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, create, update, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, update, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create, delete]
  # Routes with certificates, when cert-manager is installed.
  - apiGroups: [cert-manager.io]
    resources: [issuers, certificates]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [acme.cert-manager.io]
    resources: [orders, challenges]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "loomplane.fullname" $ }}-deployer
  namespace: {{ $namespace }}
  labels:
    {{- include "loomplane.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "loomplane.fullname" $ }}-deployer
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- if .Values.inCluster.clusterPermissions }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "loomplane.fullname" . }}-{{ .Release.Namespace }}-deployer
  labels:
    {{- include "loomplane.labels" . | nindent 4 }}
rules:
  # GPU inventory.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
  # Retained storage, and keeping a database's volume through recovery.
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "loomplane.fullname" . }}-{{ .Release.Namespace }}-deployer
  labels:
    {{- include "loomplane.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "loomplane.fullname" . }}-{{ .Release.Namespace }}-deployer
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
