apiVersion: v1
kind: Service
metadata:
  name: {{ include "loomplane.fullname" . }}
  labels:
    {{- include "loomplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "loomplane.selectorLabels" (dict "ctx" $ "component" "api") | nindent 4 }}
---
# Reaches the workers' health and metrics port; nothing else talks to them.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "loomplane.workerName" . }}
  labels:
    {{- include "loomplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8781
      targetPort: http
      protocol: TCP
  selector:
    {{- include "loomplane.selectorLabels" (dict "ctx" $ "component" "worker") | nindent 4 }}
{{- if or (and .Values.ingress.enabled .Values.ingress.blockInternalPaths) (and .Values.httpRoute.enabled .Values.httpRoute.blockInternalPaths) }}
---
# No pods match this Service, so an ingress or gateway sending health and
# metrics paths here answers 503 instead of exposing them.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "loomplane.fullname" . }}-blocked
  labels:
    {{- include "loomplane.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      protocol: TCP
{{- end }}
