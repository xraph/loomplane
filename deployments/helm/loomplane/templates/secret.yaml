{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "loomplane.fullname" . }}
  labels:
    {{- include "loomplane.labels" . | nindent 4 }}
type: Opaque
stringData:
  LOOMPLANE_SECRET_KEY: {{ required "secrets.secretKey is required (openssl rand -base64 32), or name a Secret in secrets.existingSecret" .Values.secrets.secretKey | quote }}
  LOOMPLANE_DATABASE_URL: {{ required "secrets.databaseURL is required, or name a Secret in secrets.existingSecret" .Values.secrets.databaseURL | quote }}
  {{- if and .Values.storage.url (not .Values.storage.persistence.enabled) }}
  LOOMPLANE_STORAGE_URL: {{ .Values.storage.url | quote }}
  {{- end }}
  {{- with .Values.storage.backupURL }}
  LOOMPLANE_BACKUP_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.smtpPassword }}
  LOOMPLANE_NOTIFICATIONS_SMTP_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubPrivateKey }}
  LOOMPLANE_GITHUB_PRIVATE_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubClientSecret }}
  LOOMPLANE_GITHUB_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubWebhookSecret }}
  LOOMPLANE_GITHUB_WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
