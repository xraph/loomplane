<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1120"
  height="656"
  viewBox="0 0 1120 656"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Inside Loomplane</title>
  <desc id="description">
    The React dashboard connects to one Forge application. Authsome and Warden
    handle identity and access. Project services enqueue Dispatch jobs and
    record Chronicle events. Ctrl Plane is connected through an identity bridge.
    Grove connects the application to PostgreSQL, with central migrations before
    workers start.
  </desc>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8A8A" />
    </marker>
  </defs>
  <rect width="1120" height="656" rx="20" fill="#F5F5F5" />
  <g font-family="Arial, Helvetica, sans-serif">
    <text
      x="40"
      y="49"
      fill="#737373"
      font-size="12"
      font-weight="700"
      letter-spacing="2"
    >
      LOOMPLANE / ARCHITECTURE
    </text>
    <text x="40" y="88" fill="#171717" font-size="29" font-weight="700">
      One application. Clear responsibilities.
    </text>
    <rect x="40" y="120" width="1040" height="76" rx="12" fill="#171717" />
    <text x="64" y="153" fill="#FAFAFA" font-size="19" font-weight="700">
      React dashboard
    </text>
    <text x="64" y="178" fill="#A3A3A3" font-size="14">
      shadcn/ui · authsome components · generated Forge clients
    </text>
    <rect x="853" y="140" width="202" height="35" rx="17" fill="#262626" />
    <text x="954" y="163" text-anchor="middle" fill="#5AAEE5" font-size="13">
      one browser origin
    </text>
    <path
      d="M560 196 V240"
      fill="none"
      stroke="#8A8A8A"
      stroke-width="2"
      marker-end="url(#arrow)"
    />
    <rect
      x="40"
      y="240"
      width="1040"
      height="288"
      rx="14"
      fill="#FFFFFF"
      stroke="#E5E5E5"
    />
    <text x="64" y="272" fill="#171717" font-size="19" font-weight="700">
      Forge application
    </text>
    <text x="64" y="296" fill="#525252" font-size="14">
      Routes, dependency injection, extension lifecycle, health, metrics, and
      OpenAPI
    </text>
    <g fill="#FAFAFA" stroke="#E5E5E5">
      <rect x="64" y="320" width="228" height="100" rx="10" />
      <rect x="318" y="320" width="228" height="100" rx="10" />
      <rect x="572" y="320" width="228" height="100" rx="10" />
      <rect x="826" y="320" width="230" height="100" rx="10" />
    </g>
    <rect x="64" y="320" width="5" height="100" rx="2" fill="#2F5C78" />
    <rect x="318" y="320" width="5" height="100" rx="2" fill="#6FA3C4" />
    <rect x="572" y="320" width="5" height="100" rx="2" fill="#2F5C78" />
    <rect x="826" y="320" width="5" height="100" rx="2" fill="#6FA3C4" />
    <g fill="#171717" font-size="17" font-weight="700">
      <text x="82" y="351">Identity and access</text>
      <text x="336" y="351">Projects</text>
      <text x="590" y="351">Dispatch</text>
      <text x="844" y="351">Ctrl Plane</text>
    </g>
    <g fill="#525252" font-size="14">
      <text x="82" y="378">authsome sessions</text>
      <text x="82" y="400">Warden organization roles</text>
      <text x="336" y="378">Project and environment state</text>
      <text x="336" y="400">Service-layer permission checks</text>
      <text x="590" y="378">Persistent background jobs</text>
      <text x="590" y="400">Environment initialization</text>
      <text x="844" y="378">Infrastructure lifecycle engine</text>
      <text x="844" y="400">Loomplane identity bridge</text>
    </g>
    <path
      d="M546 366 H569"
      fill="none"
      stroke="#8A8A8A"
      stroke-width="2"
      marker-end="url(#arrow)"
    />
    <rect x="64" y="444" width="482" height="58" rx="10" fill="#E3EEF4" />
    <text x="82" y="469" fill="#2F5C78" font-size="16" font-weight="700">
      Chronicle
    </text>
    <text x="82" y="489" fill="#566C7B" font-size="13">
      Identity activity and project audit events
    </text>
    <rect x="572" y="444" width="484" height="58" rx="10" fill="#F0F0F0" />
    <text x="590" y="469" fill="#171717" font-size="16" font-weight="700">
      Grove + central migrations
    </text>
    <text x="590" y="489" fill="#525252" font-size="13">
      Shared database pool; schemas applied before services start
    </text>
    <path
      d="M560 528 V560"
      fill="none"
      stroke="#8A8A8A"
      stroke-width="2"
      marker-end="url(#arrow)"
    />
    <rect x="40" y="560" width="1040" height="64" rx="12" fill="#EBEBEB" />
    <text x="64" y="588" fill="#171717" font-size="19" font-weight="700">
      PostgreSQL
    </text>
    <text x="64" y="610" fill="#525252" font-size="14">
      One database. Separate state owners for identity, roles, projects, jobs,
      audit, and infrastructure.
    </text>
  </g>
</svg>
