# Loomplane configuration.
#
# Loomplane reads this file, then config.local.yaml beside it (git ignores
# it), with LOOMPLANE_ environment variables wired in. A value written as
# "${LOOMPLANE_SOMETHING:-}" comes from that variable; when the variable is
# unset, Loomplane uses its built-in default (internal/config, Defaults).
#
# Keep secrets in the environment, never in this file.

# development, staging or production. Production refuses the development
# secret key and an http public_url.
environment: "${LOOMPLANE_ENVIRONMENT:-}"
# Where the API listens. `forge dev -p` and PORT override it in development.
http_addr: "${LOOMPLANE_HTTP_ADDR:-}"
# The address browsers and the CLI reach Loomplane at.
# (Written with its default because Forge's config loader flags an empty
# value for any key named like a URL.)
public_url: "${LOOMPLANE_PUBLIC_URL:-http://localhost:8780}"
# 32 random bytes, base64 (openssl rand -base64 32). Authsome's token
# encryption key is derived from it.
secret_key: "${LOOMPLANE_SECRET_KEY:-}"

database:
  # postgres://user:password@host:port/db?sslmode=disable
  url: "${LOOMPLANE_DATABASE_URL:-}"
  # Connections each process keeps open. Each API process runs about two dozen
  # job pollers, so raise it when the database is a slow network hop away.
  pool_size: "${LOOMPLANE_DATABASE_POOL_SIZE:-16}"

identity:
  base_path: /authsome
  app_id: "${LOOMPLANE_AUTHSOME_APP_ID:-}"
  publishable_key: "${LOOMPLANE_AUTHSOME_PUBLISHABLE_KEY:-}"
  # Unset, accounts must verify their email wherever the instance can send
  # mail, and needn't where it can't. true or false forces it. The account
  # that runs first-time setup is verified by setup itself.
  require_email_verification: "${LOOMPLANE_REQUIRE_EMAIL_VERIFICATION:-}"
  # The HttpOnly cookie the dashboard's session lives in. Cookies are shared
  # by every port on a host, so another authsome app on the same host needs
  # a different name, or each signs the other out.
  session_cookie: "${LOOMPLANE_SESSION_COOKIE:-loomplane_session}"
  # Unset leaves it to the instance's stored setting. true or false forces it.
  waitlist: "${LOOMPLANE_WAITLIST_ENABLED:-}"

console:
  path: "${LOOMPLANE_CONSOLE_PATH:-/__console}"

notifications:
  # Sends through Resend's HTTP API. Set this or smtp_host, not both. Needs
  # "from" on a domain verified in Resend.
  resend_api_key: "${LOOMPLANE_NOTIFICATIONS_RESEND_API_KEY:-}"
  # Writes each email to this folder as an .eml file instead of sending it, so
  # you can read local mail without a mail server. Set this, resend_api_key or
  # smtp_host, only one. Production refuses it. .forge/mail is gitignored.
  mail_dir: "${LOOMPLANE_NOTIFICATIONS_MAIL_DIR:-}"
  # Empty host (with no Resend key or mail_dir) disables email. For local Mailpit use 127.0.0.1:1025.
  smtp_host: "${LOOMPLANE_NOTIFICATIONS_SMTP_HOST:-}"
  smtp_port: "${LOOMPLANE_NOTIFICATIONS_SMTP_PORT:-1025}"
  smtp_username: "${LOOMPLANE_NOTIFICATIONS_SMTP_USERNAME:-}"
  smtp_password: "${LOOMPLANE_NOTIFICATIONS_SMTP_PASSWORD:-}"
  from: "${LOOMPLANE_NOTIFICATIONS_FROM:-}"
  # Implicit TLS, commonly on port 465. Production requires this.
  smtp_tls: "${LOOMPLANE_NOTIFICATIONS_SMTP_TLS:-false}"

push:
  # Off hides push settings in the app and answers 404 on the push routes.
  enabled: "${LOOMPLANE_PUSH_ENABLED:-true}"
  # The gateway that hands notifications to Apple and Google. Only XRaph's
  # gateway can reach the store app.
  gateway_url: "${LOOMPLANE_PUSH_GATEWAY_URL:-https://push.loomplane.com}"

nodes:
  # Where the other replicas of this Loomplane reach this one, for the hop
  # that carries a node's streams between replicas (/_/nodes/hop). Leave it
  # empty on a single replica. With several, set each replica's own URL, and
  # keep it on a private network or behind https.
  advertise_url: "${LOOMPLANE_NODES_ADVERTISE_URL:-}"
  # Allows that hop over plain http. The hop carries stream bytes, so turn
  # this on only on a private network.
  hop_insecure: "${LOOMPLANE_NODES_HOP_INSECURE:-false}"
  # A PEM file of the roots that verify the other replicas' certificates on
  # an https hop. Empty uses the system roots.
  hop_ca_file: "${LOOMPLANE_NODES_HOP_CA_FILE:-}"
  # How many joins one address may send a minute, and how many connect
  # challenges it may ask for. Every node behind one NAT shares the challenge
  # budget, and each asks once per reconnect. 0 turns a limit off.
  join_rate_limit: "${LOOMPLANE_NODES_JOIN_RATE_LIMIT:-10}"
  challenge_rate_limit: "${LOOMPLANE_NODES_CHALLENGE_RATE_LIMIT:-120}"

dashboard:
  # The built dashboard (pnpm --dir apps/dashboard build).
  dir: "${LOOMPLANE_DASHBOARD_DIR:-}"

orchestration:
  concurrency: 4
  poll_interval: 1s

github:
  # GitHub's REST API. Point it at GitHub Enterprise Server's /api/v3 if
  # that's where your code lives. (Written with its default, like
  # public_url, because the loader flags an empty URL.)
  api_url: "${LOOMPLANE_GITHUB_API_URL:-https://api.github.com}"
  # Where people install the App and sign in to GitHub.
  web_url: "${LOOMPLANE_GITHUB_WEB_URL:-https://github.com}"
  # The GitHub App that reads private repositories (docs/github-app.md).
  # Leave these empty to read public repositories only. Keep the private
  # key and client secret in the environment.
  app_id: "${LOOMPLANE_GITHUB_APP_ID:-}"
  app_slug: "${LOOMPLANE_GITHUB_APP_SLUG:-}"
  private_key: "${LOOMPLANE_GITHUB_PRIVATE_KEY:-}"
  private_key_file: "${LOOMPLANE_GITHUB_PRIVATE_KEY_FILE:-}"
  client_id: "${LOOMPLANE_GITHUB_CLIENT_ID:-}"
  client_secret: "${LOOMPLANE_GITHUB_CLIENT_SECRET:-}"
  # The secret GitHub signs webhook deliveries with. Set it, and the same
  # on the App's webhook, to re-analyze projects when their default
  # branch moves. Empty turns webhooks off.
  webhook_secret: "${LOOMPLANE_GITHUB_WEBHOOK_SECRET:-}"

bitbucket:
  # Bitbucket Cloud's REST API.
  api_url: "${LOOMPLANE_BITBUCKET_API_URL:-https://api.bitbucket.org/2.0}"
  # Where Bitbucket serves repository archives.
  web_url: "${LOOMPLANE_BITBUCKET_WEB_URL:-https://bitbucket.org}"
  # An OAuth consumer that reads private repositories. Leave both empty
  # to read public repositories only; set both otherwise. Keep the secret
  # in the environment.
  client_id: "${LOOMPLANE_BITBUCKET_CLIENT_ID:-}"
  client_secret: "${LOOMPLANE_BITBUCKET_CLIENT_SECRET:-}"

gitlab:
  # Where Loomplane reads gitlab.com from. You'd change it only to point at
  # a test double.
  api_url: "${LOOMPLANE_GITLAB_API_URL:-https://gitlab.com}"
  # The OAuth application that reads private projects on gitlab.com
  # (docs/gitlab.md). Set both or neither, and keep the secret in the
  # environment.
  client_id: "${LOOMPLANE_GITLAB_CLIENT_ID:-}"
  client_secret: "${LOOMPLANE_GITLAB_CLIENT_SECRET:-}"
  # Whether organizations may add a self-managed GitLab of their own.
  # true or false.
  allow_organization_hosts: "${LOOMPLANE_GITLAB_ALLOW_ORGANIZATION_HOSTS:-true}"
  # Where GitLab reaches this Loomplane's webhook, when public_url isn't an
  # address GitLab can reach. Empty means public_url.
  webhook_url: "${LOOMPLANE_GITLAB_WEBHOOK_URL:-}"
  # Self-managed GitLabs you trust go here, in config.local.yaml, since a
  # list can't come from one variable. Every organization can sign in to
  # them, and they may be http and on a private network:
  # hosts:
  #   - web_url: https://git.example.com
  #     client_id: "<the Application ID>"
  #     client_secret: "<the Secret>"

# Repository analysis, which loomplane-worker runs.
analysis:
  # Where checkouts are extracted while they're analyzed. Empty means the
  # system's temporary directory.
  work_dir: "${LOOMPLANE_ANALYSIS_WORK_DIR:-}"
  concurrency: "${LOOMPLANE_ANALYSIS_CONCURRENCY:-2}"

# Deployment planning.
planning:
  # How long a plan waits for someone to approve or reject it before it
  # expires. Between 1m and 2160h (90 days).
  approval_window: "${LOOMPLANE_PLANNING_APPROVAL_WINDOW:-168h}"
  # Ranges an external endpoint check from Loomplane's own network (a
  # Kubernetes target's) never connects to, at any port, as a list or a
  # comma-separated string, such as 10.20.0.0/16,192.0.2.7. Loomplane's own
  # host, its database, its API and its provider plugins are always
  # refused, as are loopback, link-local and 0.0.0.0/8 addresses, AWS's
  # IPv6 metadata service (fd00:ec2::254) and the NAT64 forms of all of
  # these under 64:ff9b::/96 and the local-use 64:ff9b:1::/48. Private
  # ranges are otherwise dialable, since real endpoints live there. Empty
  # denies nothing more.
  endpoint_denied_cidrs: "${LOOMPLANE_PLANNING_ENDPOINT_DENIED_CIDRS:-}"

# How often everything deployed is compared with what its cloud has live.
# 0 turns the check off. It only records drift; the next plan fixes it.
drift:
  interval: "${LOOMPLANE_DRIFT_INTERVAL:-30m}"

# Where artifacts go, such as each deployment's source. file:///path for a
# directory; empty means .loomplane/storage under the working directory.
storage:
  url: "${LOOMPLANE_STORAGE_URL:-}"
  artifact_bucket: "${LOOMPLANE_ARTIFACT_BUCKET:-loomplane-artifacts}"
  # Use an independent S3 destination for off-host recovery.
  backup_url: "${LOOMPLANE_BACKUP_URL:-}"
  backup_bucket: "${LOOMPLANE_BACKUP_BUCKET:-loomplane-backups}"

# Where Loomplane's cloud clients send requests. Leave these empty: they
# exist so tests can stand a fake Google Cloud or Vercel in for the real
# ones.
clouds:
  google_endpoint: "${LOOMPLANE_GOOGLE_ENDPOINT:-}"
  vercel_endpoint: "${LOOMPLANE_VERCEL_ENDPOINT:-}"
  aws_endpoint: "${LOOMPLANE_AWS_ENDPOINT:-}"
  render_endpoint: "${LOOMPLANE_RENDER_ENDPOINT:-}"
  digitalocean_endpoint: "${LOOMPLANE_DIGITALOCEAN_ENDPOINT:-}"
  azure_endpoint: "${LOOMPLANE_AZURE_ENDPOINT:-}"
  cloudflare_endpoint: "${LOOMPLANE_CLOUDFLARE_ENDPOINT:-}"
  cloudflare_registrar_sandbox: "${LOOMPLANE_CLOUDFLARE_REGISTRAR_SANDBOX:-false}"
  acme_directory: "${LOOMPLANE_ACME_DIRECTORY:-}"
  managed_clusters:
    management_probe:
      provider: "${LOOMPLANE_MANAGED_CLUSTERS_MANAGEMENT_PROBE_PROVIDER:-}"
      network_id: "${LOOMPLANE_MANAGED_CLUSTERS_MANAGEMENT_PROBE_NETWORK_ID:-}"
      evidence_id: "${LOOMPLANE_MANAGED_CLUSTERS_MANAGEMENT_PROBE_EVIDENCE_ID:-}"
      url: "${LOOMPLANE_MANAGED_CLUSTERS_MANAGEMENT_PROBE_URL:-}"
      spki_sha256: "${LOOMPLANE_MANAGED_CLUSTERS_MANAGEMENT_PROBE_SPKI_SHA256:-}"
      expires_at: "${LOOMPLANE_MANAGED_CLUSTERS_MANAGEMENT_PROBE_EXPIRES_AT:-}"
    enabled: "${LOOMPLANE_MANAGED_CLUSTERS_ENABLED:-false}"
    qualification_org_id: "${LOOMPLANE_MANAGED_CLUSTERS_QUALIFICATION_ORG_ID:-}"
    qualification_operator_id: "${LOOMPLANE_MANAGED_CLUSTERS_QUALIFICATION_OPERATOR_ID:-}"
    qualification_account_id: "${LOOMPLANE_MANAGED_CLUSTERS_QUALIFICATION_ACCOUNT_ID:-}"
    qualification_region: "${LOOMPLANE_MANAGED_CLUSTERS_QUALIFICATION_REGION:-}"
    max_node_hourly_micro_usd: "${LOOMPLANE_MANAGED_CLUSTERS_MAX_NODE_HOURLY_MICRO_USD:-0}"
    max_nodes: "${LOOMPLANE_MANAGED_CLUSTERS_MAX_NODES:-0}"
    max_account_creates: "${LOOMPLANE_MANAGED_CLUSTERS_MAX_ACCOUNT_CREATES:-2}"
  # Lets pools add servers on their own, within each Cloud's capacity policy.
  # Off, policies are saved but nothing grows. Still being qualified.
  automatic_capacity:
    enabled: "${LOOMPLANE_AUTOMATIC_CAPACITY_ENABLED:-false}"
  # Lets people connect the Kubernetes cluster Loomplane runs in without a
  # kubeconfig. Loomplane deploys there as its own service account, which
  # every organization on this instance then shares, so turn it on only
  # where they all may deploy to this cluster. The pod needs its service
  # account token mounted; the Helm chart's inCluster values do both.
  kubernetes_in_cluster: "${LOOMPLANE_KUBERNETES_IN_CLUSTER:-false}"
  # Loomplane's sign-in app at each cloud, so people can connect by signing
  # in. These win over anything registered on the dashboard's Cloud sign-in
  # page (Settings, platform owners and admins only), which is the
  # alternative to setting them here. Leave both empty to use the page, or
  # to keep token entry only. Keep the secret in the environment.
  oauth:
    cloudflare:
      client_id: "${LOOMPLANE_CLOUDFLARE_OAUTH_CLIENT_ID:-}"
      client_secret: "${LOOMPLANE_CLOUDFLARE_OAUTH_CLIENT_SECRET:-}"
    digitalocean:
      client_id: "${LOOMPLANE_DIGITALOCEAN_OAUTH_CLIENT_ID:-}"
      client_secret: "${LOOMPLANE_DIGITALOCEAN_OAUTH_CLIENT_SECRET:-}"
    vercel:
      client_id: "${LOOMPLANE_VERCEL_OAUTH_CLIENT_ID:-}"
      client_secret: "${LOOMPLANE_VERCEL_OAUTH_CLIENT_SECRET:-}"
      # The integration's slug in its Vercel install address.
      slug: "${LOOMPLANE_VERCEL_OAUTH_SLUG:-}"
    gcp:
      client_id: "${LOOMPLANE_GCP_OAUTH_CLIENT_ID:-}"
      client_secret: "${LOOMPLANE_GCP_OAUTH_CLIENT_SECRET:-}"
    azure:
      client_id: "${LOOMPLANE_AZURE_OAUTH_CLIENT_ID:-}"
      client_secret: "${LOOMPLANE_AZURE_OAUTH_CLIENT_SECRET:-}"

providers:
  # Deployment targets that run as their own services, built with
  # pkg/provider/sdk. Each is a url and the token it was started with:
  #   plugins:
  #     - url: http://fly-provider:9000
  #       token: "${FLY_PROVIDER_TOKEN}"
  plugins: []
  # Targets whose plans can be reviewed but not carried out, by name, such
  # as render or cloud-run. A list, or a comma-separated string.
  paused: "${LOOMPLANE_PAUSED_PROVIDERS:-}"

worker:
  # Where loomplane-worker serves its health checks, and nothing else.
  http_addr: "${LOOMPLANE_WORKER_HTTP_ADDR:-}"

# Federation management and its separate mTLS agent listener are opt-in.
# Provision SPIRE identity and scoped signing keys before enabling runtime.
federation:
  launch:
    enabled: "${LOOMPLANE_FEDERATION_LAUNCH_ENABLED:-false}"
    control_endpoint: "${LOOMPLANE_FEDERATION_LAUNCH_CONTROL_ENDPOINT:-}"
    agent_image: "${LOOMPLANE_FEDERATION_LAUNCH_AGENT_IMAGE:-}"
    trust_generation: "${LOOMPLANE_FEDERATION_LAUNCH_TRUST_GENERATION:-0}"
  enabled: "${LOOMPLANE_FEDERATION_ENABLED:-false}"
  identity:
    enabled: "${LOOMPLANE_FEDERATION_IDENTITY_ENABLED:-false}"
    organization_id: "${LOOMPLANE_FEDERATION_IDENTITY_ORGANIZATION_ID:-}"
    trust_domain: "${LOOMPLANE_FEDERATION_IDENTITY_TRUST_DOMAIN:-}"
    admin_socket: "${LOOMPLANE_FEDERATION_IDENTITY_ADMIN_SOCKET:-}"
  runtime:
    enabled: "${LOOMPLANE_FEDERATION_RUNTIME_ENABLED:-false}"
    listen_address: "${LOOMPLANE_FEDERATION_RUNTIME_LISTEN_ADDRESS:-}"
    organization_id: "${LOOMPLANE_FEDERATION_RUNTIME_ORGANIZATION_ID:-}"
    trust_domain: "${LOOMPLANE_FEDERATION_RUNTIME_TRUST_DOMAIN:-}"
    workload_api: "${LOOMPLANE_FEDERATION_RUNTIME_WORKLOAD_API:-}"
    signing_keys_file: "${LOOMPLANE_FEDERATION_RUNTIME_SIGNING_KEYS_FILE:-}"

# The AI section (models) is opt-in.
ai:
  enabled: "${LOOMPLANE_AI_ENABLED:-false}"
  # The infra agent's server provider: anthropic, openai or openai-compatible.
  provider: "${LOOMPLANE_AI_PROVIDER:-anthropic}"
  # Optional even with the agent on: a workspace can bring its own key.
  api_key: "${LOOMPLANE_AI_API_KEY:-}"
  # Required for openai-compatible, an optional override otherwise.
  base_url: "${LOOMPLANE_AI_BASE_URL:-}"
  model: "${LOOMPLANE_AI_MODEL:-claude-sonnet-5-5}"
  # Prices for models nexus's catalog doesn't know. The agent uses server
  # prices only (these and nexus's catalog), never a workspace's per-key
  # prices. YAML only. Each item is {provider, model, input_per_million,
  # output_per_million}, in decimal USD, such as "3" or "0.80".
  prices: []
  # One embedding model for the whole server, for retrieval.
  knowledge:
    embedding_provider: "${LOOMPLANE_AI_EMBEDDING_PROVIDER:-}"   # openai or openai-compatible
    embedding_api_key: "${LOOMPLANE_AI_EMBEDDING_API_KEY:-}"
    embedding_base_url: "${LOOMPLANE_AI_EMBEDDING_BASE_URL:-}"
    embedding_model: "${LOOMPLANE_AI_EMBEDDING_MODEL:-}"
    dimensions: "${LOOMPLANE_AI_EMBEDDING_DIMENSIONS:-1536}"
  models:
    # The Hugging Face Hub, or a mirror of it. The workspace's Hugging Face
    # token is sent here, so it must be https (http only for localhost).
    huggingface_url: "${LOOMPLANE_AI_MODELS_HUGGINGFACE_URL:-https://huggingface.co}"

# The database gateway. Its snapshots are signed with the Ed25519 keys in
# this file: private (0600), as an absolute path, holding one key as
# {"version":1,"private_key":"<base64 seed>","not_before":...,"not_after":...}
# or several, for a rotation, as {"version":2,"keys":[{"private_key":...,
# "not_before":...,"not_after":...}, ...]}. docs/postgres-services.md says
# how to rotate. Leave it empty and the gateway endpoints answer 503.
dbgateway:
  signing_key_file: "${LOOMPLANE_DBGATEWAY_SIGNING_KEY_FILE:-}"
