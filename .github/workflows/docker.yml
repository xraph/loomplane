name: Docker

# Publishes the image for every commit on main once CI passes, so you can
# run main without cutting a release. Release versions come from
# release.yml; this workflow never writes a version tag.
#
#   ghcr.io/<repo>:main          moves with main
#   ghcr.io/<repo>:sha-<short>   one per commit, never moves
#
# Set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets to mirror both tags
# to Docker Hub (vars.DOCKERHUB_REPO, default xraph/loomplane).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-main
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build (${{ matrix.arch }})
    # Only main publishes: a failed CI run, a pull request, or a manual run
    # from another branch would otherwise move :main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Tags too, so the version names the last release.
          fetch-depth: 0
      - name: Version
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployments/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=main-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=main-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=FSL-1.1-ALv2
      - name: Export digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker Hub
        id: hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO || 'xraph/loomplane' }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "image=docker.io/${DOCKERHUB_REPO}" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN aren't both set, so this publishes to GHCR only."
          fi
      - if: steps.hub.outputs.image != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag main and the commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          HUB: ${{ steps.hub.outputs.image }}
        run: |
          tags=()
          for image in "$IMAGE" ${HUB:+"$HUB"}; do
            tags+=(--tag "${image}:main" --tag "${image}:sha-${SHA::7}")
          done
          refs=()
          for digest in digests/*; do refs+=("${IMAGE}@sha256:${digest##*/}"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "${IMAGE}:sha-${SHA::7}"
