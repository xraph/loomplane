name: Publish (ingress)

# Loomplane's server proxy image: Caddy with the Cloudflare DNS module, from
# deployments/ingress. Run it by hand with a tag such as 2.11.7-1, then pin
# the manifest digest it prints in internal/clouds/server (IngressImage).
#
# Each architecture builds on its own native runner. The Dockerfile fails
# the build when the DNS module is missing, so only a build that has it is
# pushed, by digest. The publish job joins the digests into one
# multi-platform manifest and tags it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish, e.g. 2.11.7-1.
        required: true
        type: string

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/loomplane-ingress

jobs:
  image:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish by digest
        id: image
        uses: docker/build-push-action@v7
        with:
          context: deployments/ingress
          file: deployments/ingress/Dockerfile
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=ingress-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ingress-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.tag }}
      - name: Export digest
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "linux/${ARCH}: ${IMAGE}@${DIGEST}"
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: ingress-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish manifest
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ingress-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the digests under the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          refs=()
          for digest in digests/*; do refs+=("${IMAGE}@sha256:${digest##*/}"); done
          docker buildx imagetools create --tag "${IMAGE}:${TAG}" "${refs[@]}"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
          manifest=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" | awk '$1 == "Digest:" {print $2; exit}')
          test -n "$manifest"
          {
            echo "### ${IMAGE}:${TAG}"
            echo
            echo "Pin as \`${IMAGE}:${TAG}@${manifest}\`. Per architecture:"
            echo
            for digest in digests/*; do echo "- \`${IMAGE}@sha256:${digest##*/}\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
