name: Release

# Cuts and publishes a Loomplane release. There are two ways in.
#
#   git push origin v1.2.3
#       Releases a tag you pushed. Everything publishes.
#
#   Actions > Release > Run workflow, or
#   gh workflow run release.yml -f version=v1.2.3 [-f target=cli]
#       target "all" tags the commit you ran it from, which must be on
#       main, and publishes everything. No PAT is needed: the tag, the
#       GitHub release and every publish job happen in this one run.
#       target "cli" or "docker" re-publishes one part of a release that
#       already exists, from its tag, wherever you run it from.
#
# What a release publishes:
#
#   release   the tag and the GitHub release, through xraph/workflows
#             go-release.yml
#   cli       GoReleaser through xraph/workflows go-binary-release.yml:
#             loomctl for macOS, Linux and Windows with Homebrew and Scoop,
#             and the loomplane_* server archives with the dashboard
#   docker    publish-docker.yml: smoke-tested AMD64 and ARM64 images on
#             GHCR (and Docker Hub with its secrets), plus the deployment
#             bundle on the release
#
# Lint, unit and integration tests gate all of it unless you tick
# skip-tests, which is for re-publishing a tag that passed them already.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, e.g. v1.2.3 or v1.3.0-rc.1
        required: true
        type: string
      target:
        description: all cuts a new release. cli or docker re-publishes one part of an existing one.
        required: true
        type: choice
        default: all
        options: [all, cli, docker]
      skip-tests:
        description: Skip lint and tests (only for a tag that passed them)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      create-release: ${{ steps.plan.outputs.create-release }}
      cli: ${{ steps.plan.outputs.cli }}
      docker: ${{ steps.plan.outputs.docker }}
      skip-tests: ${{ steps.plan.outputs.skip-tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Every branch and tag, to check the tag and where it points.
          fetch-depth: 0
      - name: Work out what to release
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
          SKIP_TESTS: ${{ inputs.skip-tests }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            tag=$GITHUB_REF_NAME target=all SKIP_TESTS=false
          else
            tag=v${VERSION#v} target=$TARGET
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$tag isn't vMAJOR.MINOR.PATCH with an optional -prerelease suffix."
            exit 1
          fi

          tagged=$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" || true)
          released=false
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then released=true; fi

          if [ "$EVENT" = workflow_dispatch ] && [ "$target" = all ]; then
            if [ -n "$tagged" ]; then
              echo "::error::$tag already exists at ${tagged::7}. Pick a new version, or run with target cli or docker to re-publish part of it."
              exit 1
            fi
            commit=$GITHUB_SHA ref=$GITHUB_SHA create=true
          else
            if [ -z "$tagged" ]; then
              echo "::error::$tag doesn't exist. Run with target all to cut it."
              exit 1
            fi
            commit=$tagged ref=refs/tags/$tag
            # A tag pushed by hand gets its release here. One made in the
            # Releases page already has it, so this only publishes into it.
            create=false
            if [ "$EVENT" = push ] && [ "$released" = false ]; then create=true; fi
            if [ "$create" = false ] && [ "$released" = false ]; then
              echo "::error::$tag has no GitHub release to publish into. Push the tag again, or create the release first."
              exit 1
            fi
          fi

          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::${commit::7} isn't on main. Releases are cut from main only."
            exit 1
          fi

          cli=false docker=false
          case "$target" in
            all) cli=true docker=true ;;
            cli) cli=true ;;
            docker) docker=true ;;
          esac
          {
            echo "tag=$tag"
            echo "ref=$ref"
            echo "create-release=$create"
            echo "cli=$cli"
            echo "docker=$docker"
            echo "skip-tests=$SKIP_TESTS"
          } | tee -a "$GITHUB_OUTPUT"
          {
            echo "### Releasing \`$tag\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${commit::7}\` |"
            echo "| New GitHub release | $create |"
            echo "| CLI and archives | $cli |"
            echo "| Docker | $docker |"
            echo "| Tests | $([ "$SKIP_TESTS" = true ] && echo skipped || echo run) |"
          } >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Release checks
    needs: plan
    if: needs.plan.outputs.skip-tests != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: loomplane
          POSTGRES_PASSWORD: loomplane
          POSTGRES_DB: loomplane
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loomplane -d loomplane"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      LOOMPLANE_TEST_DATABASE_URL: postgres://loomplane:loomplane@localhost:5432/loomplane?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/dashboard/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml
      - run: pnpm --dir apps/dashboard install --frozen-lockfile
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --build-tags=integration --timeout=10m ./...
      - run: make lint-dashboard test
      - run: go test -race -count=1 -tags=integration ./tests/integration/

  release:
    name: Tag and GitHub release
    needs: [plan, checks]
    if: >-
      always() && needs.plan.result == 'success' &&
      needs.plan.outputs.create-release == 'true' &&
      contains(fromJSON('["success","skipped"]'), needs.checks.result)
    permissions:
      contents: write
    uses: xraph/workflows/.github/workflows/go-release.yml@adbc00609c913abaabd7b38d11533e0a44b92432 # v1.19.0
    with:
      # Empty on a tag push, where go-release.yml reads the pushed tag. A
      # version makes it tag github.sha first.
      version: ${{ github.event_name == 'workflow_dispatch' && needs.plan.outputs.tag || '' }}
      # The checks job above already ran them, with Postgres.
      run-tests: false
      # A changelog commit would move the tag off the commit plan checked.
      update-changelog: false
      # examples/ and tests/ hold go.mod files that aren't modules we ship.
      skip-nested-modules: true

  cli:
    name: CLI and archives
    needs: [plan, checks, release]
    if: >-
      always() && needs.plan.result == 'success' &&
      needs.plan.outputs.cli == 'true' &&
      contains(fromJSON('["success","skipped"]'), needs.checks.result) &&
      contains(fromJSON('["success","skipped"]'), needs.release.result)
    permissions:
      contents: write
      packages: write
    uses: xraph/workflows/.github/workflows/go-binary-release.yml@4cfa392ef6078a0163b69fade13c2e48cebb0cc6 # v1.20.0
    with:
      ref: ${{ needs.plan.outputs.tag }}
      go-version-file: go.mod
      # The server archives carry the built dashboard.
      node-version: "24"
      pnpm-directory: apps/dashboard
    secrets:
      # One token pushes to both xraph/homebrew-tap and xraph/scoop-bucket.
      # Without it the archives still publish.
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      SCOOP_BUCKET_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  docker:
    name: Docker
    needs: [plan, checks, release]
    if: >-
      always() && needs.plan.result == 'success' &&
      needs.plan.outputs.docker == 'true' &&
      contains(fromJSON('["success","skipped"]'), needs.checks.result) &&
      contains(fromJSON('["success","skipped"]'), needs.release.result)
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish-docker.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
