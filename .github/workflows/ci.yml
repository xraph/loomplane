name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The forge CLI has no tags yet, so this pins the commit whose generator
  # wrote apps/dashboard/src/client/forge. Move it when you regenerate.
  FORGE_CLI: github.com/xraph/forge/cmd/forge@v0.0.0-20261013234600-b0f1622a9bcf

jobs:
  go:
    name: Go
    uses: xraph/workflows/.github/workflows/go-ci.yml@adbc00609c913abaabd7b38d11533e0a44b92432 # v1.19.0
    permissions:
      contents: read
      security-events: write
    with:
      go-versions: '["1.26.10"]'
      primary-go-version: "1.26.10"
      os: '["ubuntu-latest"]'
      # Root make test also runs the dashboard, which has its own job.
      prefer-makefile: false
      coverage: false
      golangci-lint-version: v2.12.2
      golangci-lint-timeout: 10m
      govulncheck-version: v1.8.0
      # Configured gosec rules gate in lint. The extra standalone scan reports
      # findings without overriding this repository's documented exclusions.
      gosec-fail-on-findings: false

  fuzz:
    name: Fuzz the parsers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZTIME=15s

  integration:
    name: Integration tests (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    # Boots the whole app against a real Postgres. Each test makes a
    # database of its own on this server.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: loomplane
          POSTGRES_PASSWORD: loomplane
          POSTGRES_DB: loomplane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loomplane -d loomplane"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      LOOMPLANE_TEST_DATABASE_URL: postgres://loomplane:loomplane@localhost:5432/loomplane?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: python3 -m unittest discover -s scripts -p test_integration_cohorts.py
      # A cold -race build of the suite can take longer than the cohort
      # script's 300 second discovery bound on a slow runner. Building it
      # here fills the build cache, so that bound times discovery alone.
      - run: go test -race -tags=integration -c -o /dev/null ./tests/integration/
      - run: python3 scripts/integration-cohorts.py --shard ${{ matrix.shard }} --shards 8

  dashboard:
    name: Dashboard
    uses: xraph/workflows/.github/workflows/node-ci.yml@adbc00609c913abaabd7b38d11533e0a44b92432 # v1.19.0
    with:
      working-directory: apps/dashboard
      node-version: "24"
      scripts: '["typecheck","lint","test","build"]'

  client:
    name: Generated clients
    # The dashboard's API clients are generated from the specs in
    # apps/dashboard/specs. This fails when someone edits one by hand or
    # changes a spec without regenerating.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go install "${FORGE_CLI}"
      - run: forge client check
        working-directory: apps/dashboard

  image:
    name: Container image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags too, so the version names a release once there is one.
          fetch-depth: 0
      - name: Version
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build for production smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployments/docker/Dockerfile
          push: false
          load: true
          tags: loomplane:ci
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Production Docker smoke test
        run: bash scripts/test-production.sh loomplane:ci

  helm:
    name: Helm chart
    # Lints the chart, validates everything it renders, checks it refuses
    # settings that can't be highly available, and that
    # deployments/kubernetes/loomplane.yaml is current.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          # The committed Kubernetes manifest is rendered with this version; a
          # newer Helm can add blank lines and fail the staleness check.
          version: v4.2.0
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz |
            sudo tar -xz -C /usr/local/bin kubeconform
      - run: bash scripts/check-helm.sh

  kubernetes:
    name: Kubernetes (kind)
    # Installs the chart in a three-node kind cluster and keeps requests
    # going through the Service while an API pod is deleted, both
    # Deployments restart and a node drains. Any failed request fails it.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          # The committed Kubernetes manifest is rendered with this version; a
          # newer Helm can add blank lines and fail the staleness check.
          version: v4.2.0
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployments/docker/Dockerfile
          push: false
          load: true
          tags: loomplane:k8s-test
          build-args: VERSION=k8s-test
          cache-from: type=gha
      - run: bash scripts/test-kubernetes.sh loomplane:k8s-test
