name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The forge CLI has no tags yet, so this pins the commit whose generator
  # wrote apps/dashboard/src/client/forge. Move it when you regenerate.
  FORGE_CLI: github.com/xraph/forge/cmd/forge@v0.0.0-20261013234600-b0f1622a9bcf

jobs:
  go:
    name: Go
    uses: xraph/workflows/.github/workflows/go-ci.yml@adbc00609c913abaabd7b38d11533e0a44b92432 # v1.19.0
    permissions:
      contents: read
      security-events: write
    with:
      go-versions: '["1.26.9"]'
      primary-go-version: "1.26.9"
      os: '["ubuntu-latest"]'
      # Root make test also runs the dashboard, which has its own job.
      prefer-makefile: false
      coverage: false
      golangci-lint-version: v2.12.2
      golangci-lint-timeout: 10m
      govulncheck-version: v1.8.0
      # Configured gosec rules gate in lint. The extra standalone scan reports
      # findings without overriding this repository's documented exclusions.
      gosec-fail-on-findings: false

  fuzz:
    name: Fuzz the parsers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZTIME=15s

  integration:
    name: Integration tests
    # Boots the whole app against a real Postgres. Each test makes a
    # database of its own on this server.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: loomplane
          POSTGRES_PASSWORD: loomplane
          POSTGRES_DB: loomplane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loomplane -d loomplane"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      LOOMPLANE_TEST_DATABASE_URL: postgres://loomplane:loomplane@localhost:5432/loomplane?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -tags=integration ./tests/integration/

  dashboard:
    name: Dashboard
    uses: xraph/workflows/.github/workflows/node-ci.yml@adbc00609c913abaabd7b38d11533e0a44b92432 # v1.19.0
    with:
      working-directory: apps/dashboard
      node-version: "24"
      scripts: '["typecheck","lint","test","build"]'

  client:
    name: Generated clients
    # The dashboard's API clients are generated from the specs in
    # apps/dashboard/specs. This fails when someone edits one by hand or
    # changes a spec without regenerating.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go install "${FORGE_CLI}"
      - run: forge client check
        working-directory: apps/dashboard

  image:
    name: Container image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags too, so the version names a release once there is one.
          fetch-depth: 0
      - name: Version
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build for production smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployments/docker/Dockerfile
          push: false
          load: true
          tags: loomplane:ci
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Production Docker smoke test
        run: bash scripts/test-production.sh loomplane:ci
