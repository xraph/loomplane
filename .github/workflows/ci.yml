name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The forge CLI has no tags yet, so this pins the commit whose generator
  # wrote apps/dashboard/src/client/forge. Move it when you regenerate.
  FORGE_CLI: github.com/xraph/forge/cmd/forge@v0.0.0-20261012043317-2314a6ba593a

jobs:
  lint:
    name: Go lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=10m --build-tags=integration

  test:
    name: Go unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  integration:
    name: Integration tests
    # Boots the whole app against a real Postgres. Each test makes a
    # database of its own on this server.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: loomplane
          POSTGRES_PASSWORD: loomplane
          POSTGRES_DB: loomplane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loomplane -d loomplane"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      LOOMPLANE_TEST_DATABASE_URL: postgres://loomplane:loomplane@localhost:5432/loomplane?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -tags=integration ./tests/integration/

  dashboard:
    name: Dashboard
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v7
      # Reads the version from packageManager in package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/dashboard/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  client:
    name: Generated clients
    # The dashboard's API clients are generated from the specs in
    # apps/dashboard/specs. This fails when someone edits one by hand or
    # changes a spec without regenerating.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go install "${FORGE_CLI}"
      - run: forge client check
        working-directory: apps/dashboard

  image:
    name: Container image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags too, so the version names a release once there is one.
          fetch-depth: 0
      - name: Version
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployments/docker/Dockerfile
          push: false
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
