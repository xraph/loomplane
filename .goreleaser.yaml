# GoReleaser builds Loomplane's binaries for every release. The release
# workflow (.github/workflows/release.yml) runs it through xraph/workflows
# go-binary-release.yml, against the release's tag, once the GitHub release
# exists. It appends the archives to that release, next to the image and the
# Docker bundle.
#
#   loomctl      the CLI, for macOS, Linux and Windows. Homebrew and Scoop
#                install this one.
#   loomctl image  ghcr.io/xraph/loomctl, loomctl as the entrypoint, for
#                Linux on amd64 and arm64.
#   loomplane    the API with its dashboard and config.yaml, plus
#                loomplane-worker, as one archive for Linux and macOS.
#   packages     .deb and .rpm for both on Linux amd64 and arm64. The
#                loomplane one carries the systemd units in deployments/linux.
#
# Try it without publishing: goreleaser release --snapshot --clean
version: 2

project_name: loomplane

before:
  hooks:
    - go mod download
    # The server archive carries the built dashboard.
    - pnpm --dir apps/dashboard install --frozen-lockfile
    - pnpm --dir apps/dashboard build
    # Cross-compiling all release targets overflows the ~18 GB left on a
    # standard GitHub Actions runner unless build-only dependencies and unused
    # preinstalled SDKs are cleared before go build starts.
    - sh -c 'if [ "${GITHUB_ACTIONS:-}" = "true" ]; then rm -rf apps/dashboard/node_modules "${HOME}/.local/share/pnpm"; sudo -n rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true; fi'

builds:
  - id: loomctl
    main: ./cmd/loomctl
    binary: loomctl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/xraph/loomplane/internal/buildinfo.Version={{ .Tag }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: loomplane
    main: ./cmd/loomplane
    binary: loomplane
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/xraph/loomplane/internal/buildinfo.Version={{ .Tag }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: loomplane-worker
    main: ./cmd/loomplane-worker
    binary: loomplane-worker
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/xraph/loomplane/internal/buildinfo.Version={{ .Tag }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: loomctl
    ids: [loomctl]
    name_template: "loomctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

  # Unpack it, set LOOMPLANE_DASHBOARD_DIR=./dashboard and run ./loomplane
  # from that directory, where it finds config.yaml. On Linux, the systemd/
  # files install it as services (docs: operations/linux).
  - id: server
    ids: [loomplane, loomplane-worker]
    name_template: "loomplane_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - config.yaml
      # A directory keeps its layout (index.html beside assets/); a glob
      # flattens it.
      - src: apps/dashboard/dist
        dst: dashboard
      # A single file's dst is its full path in the archive.
      - src: deployments/linux/loomplane.service
        dst: systemd/loomplane.service
      - src: deployments/linux/loomplane-worker.service
        dst: systemd/loomplane-worker.service
      - src: deployments/linux/loomplane.env
        dst: systemd/loomplane.env

# Linux packages, for apt and dnf hosts on amd64 and arm64. GoReleaser adds
# them to the release and to binaries-checksums.txt with the archives.
nfpms:
  # /usr/bin/loomctl and nothing else.
  - id: loomctl
    ids: [loomctl]
    package_name: loomctl
    file_name_template: "{{ .ConventionalFileName }}"
    formats: [deb, rpm]
    vendor: XRaph
    maintainer: XRaph
    homepage: https://www.loomplane.com
    description: Plan, approve and follow Loomplane deployments from your terminal.
    license: FSL-1.1-ALv2
    section: utils
    bindir: /usr/bin
    recommends: [ca-certificates]

  # The API, the worker, the dashboard and their systemd units. Installing it
  # creates the loomplane user and starts nothing: you fill in
  # /etc/loomplane/loomplane.env first.
  - id: server
    ids: [loomplane, loomplane-worker]
    package_name: loomplane
    file_name_template: "{{ .ConventionalFileName }}"
    formats: [deb, rpm]
    vendor: XRaph
    maintainer: XRaph
    homepage: https://www.loomplane.com
    description: Self-hosted deployment platform for monorepos. The API, dashboard and analysis worker.
    license: FSL-1.1-ALv2
    section: net
    bindir: /usr/bin
    recommends: [ca-certificates]
    contents:
      - src: apps/dashboard/dist
        dst: /usr/share/loomplane/dashboard
        type: tree
      # config.yaml changes between versions. Left unedited, an upgrade
      # replaces it; your settings belong in loomplane.env.
      - src: config.yaml
        dst: /etc/loomplane/config.yaml
        type: config|noreplace
        file_info:
          mode: 0644
      - src: deployments/linux/loomplane.env
        dst: /etc/loomplane/loomplane.env
        type: config|noreplace
        file_info:
          mode: 0640
      - src: deployments/linux/loomplane.service
        dst: /usr/lib/systemd/system/loomplane.service
        file_info:
          mode: 0644
      - src: deployments/linux/loomplane-worker.service
        dst: /usr/lib/systemd/system/loomplane-worker.service
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/loomplane/LICENSE
        file_info:
          mode: 0644
    scripts:
      preinstall: deployments/linux/package/preinstall.sh
      postinstall: deployments/linux/package/postinstall.sh
      preremove: deployments/linux/package/preremove.sh
      postremove: deployments/linux/package/postremove.sh

# ghcr.io/xraph/loomctl, with loomctl as its entrypoint, so a container joins
# as a node with `docker run ghcr.io/xraph/loomctl node run`. The release
# workflow turns on Docker for this job. The image carries the binary and CA
# certificates, which the node needs to reach Loomplane over TLS.
dockers_v2:
  - id: loomctl
    ids: [loomctl]
    dockerfile: deployments/loomctl/Dockerfile
    images:
      - ghcr.io/xraph/loomctl
    # latest moves only for a stable release; an empty tag is dropped.
    tags:
      - "{{ .Tag }}"
      - '{{ if not .Prerelease }}latest{{ end }}'
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: https://github.com/xraph/loomplane
      org.opencontainers.image.version: "{{ .Tag }}"
      org.opencontainers.image.licenses: FSL-1.1-ALv2

checksum:
  # publish-docker.yml already uploads SHA256SUMS for the Docker bundle.
  name_template: binaries-checksums.txt

# The release already has its notes; GoReleaser only adds files to it.
changelog:
  disable: true

release:
  mode: keep-existing

homebrew_casks:
  - name: loomctl
    ids: [loomctl]
    binaries: [loomctl]
    repository:
      owner: xraph
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # Without a token that can push to the tap, release everything else.
    skip_upload: '{{ if eq .Env.HOMEBREW_TAP_TOKEN "" }}true{{ else }}auto{{ end }}'
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    homepage: https://github.com/xraph/loomplane
    description: "Plan, approve and follow Loomplane deployments from your terminal"
    license: FSL-1.1-ALv2
    caveats: "Run 'loomctl login --url https://your-loomplane --key lp_live_...' to get started"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/loomctl"]
          end

scoops:
  - name: loomctl
    ids: [loomctl]
    repository:
      owner: xraph
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    skip_upload: '{{ if eq .Env.SCOOP_BUCKET_TOKEN "" }}true{{ else }}auto{{ end }}'
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    homepage: https://github.com/xraph/loomplane
    description: "Plan, approve and follow Loomplane deployments from your terminal"
    license: FSL-1.1-ALv2
