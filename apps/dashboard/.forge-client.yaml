# The dashboard's API clients, generated by `forge client generate` from the
# specs in specs/ (pnpm gen:client). Everything under src/client/forge/ is
# generated: don't edit it, `forge client check` reports drift.
#
# Refresh the specs first when the backend changes (pnpm gen:specs, with
# Loomplane running on :8780).
source:
  sources:
    - { type: file, path: ./specs/loomplane.openapi.json }
    - { type: file, path: ./specs/authsome.openapi.json }

defaults:
  language: typescript
  base_url: ""
  client_only: true

  # Required by config validation; overridden by every client below.
  package: "@loomplane/api-client"

  # ops.ts (each endpoint's cache contract) and hooks.ts (one typed binding
  # per operation) over @forge-go/client-core. Without this the output is a
  # plain REST client with no normalized cache.
  hooks: true

  # camelCase TypeScript over the snake_case wire. The codec table does the
  # renaming, and only for NAMED request schemas, so request bodies stay
  # named types on the backend.
  field_naming: camel

  streaming: false
  output: ./src/client/forge

clients:
  # Loomplane's own API: projects, environments, infrastructure, session.
  - name: loomplane
    output: ./src/client/forge/loomplane
    package: "@loomplane/loomplane-client"
    include: ["/api/**"]

  # authsome's organization API: organizations, members, invitations, and
  # switching the session's active organization. Sign-in and sessions are
  # deliberately absent: @authsome/ui-react owns that state.
  - name: authsome
    output: ./src/client/forge/authsome
    package: "@loomplane/authsome-client"
    include: ["/authsome/v1/orgs", "/authsome/v1/orgs/**", "/authsome/v1/me/switch-org"]
