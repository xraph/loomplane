packages: []

allowBuilds:
  esbuild: true
  msw: false

# Forge's own packages, published with the Go modules they match: the client
# packages at 1.14.1 (forge v1.14.1). pnpm holds back releases younger than
# its minimum age, so each is let through by name. Drop an entry once its
# release is old enough to pass on its own.
minimumReleaseAgeExclude:
  - '@forge-go/client-core@1.14.1'
  - '@forge-go/client-react@1.14.1'
