packages: []

allowBuilds:
  esbuild: true
  msw: false

# Forge's own packages, published with the Go modules they match: the client
# packages at 1.13.0 (forge v1.13.0) and the dashboard host, kit, runtime and
# plugins at 0.3.0. pnpm holds back releases younger than its minimum age, so
# each is let through by name. Drop an entry once its release is old enough
# to pass on its own.
minimumReleaseAgeExclude:
  - '@forge-go/client-core@1.13.0'
  - '@forge-go/client-react@1.13.0'
  - '@forge-go/dashboard-host@0.3.0'
  - '@forge-go/dashboard-kit@0.3.0'
  - '@forge-go/dashboard-plugin-authsome@0.3.0'
  - '@forge-go/dashboard-plugin-chronicle@0.3.0'
  - '@forge-go/dashboard-plugin-core@0.3.0'
  - '@forge-go/dashboard-plugin-ctrlplane@0.3.0'
  - '@forge-go/dashboard-plugin-herald@0.3.0'
  - '@forge-go/dashboard-plugin-keysmith@0.3.0'
  - '@forge-go/dashboard-plugin-relay@0.3.0'
  - '@forge-go/dashboard-plugin-trove@0.3.0'
  - '@forge-go/dashboard-plugin-warden@0.3.0'
  - '@forge-go/dashboard-plugin@0.3.0'
  - '@forge-go/dashboard-runtime@0.3.0'

patchedDependencies:
  # Loomplane's cookie sessions. AuthManager takes session: "cookie", which
  # leaves the session in the httpOnly cookie the backend sets on sign-in:
  # requests carry the cookie, a reload asks /v1/me who's signed in, and no
  # token is stored or sent. Without it the SDK only restores a session from
  # its own storage, so the token had to live in local storage, where any
  # script can read it. src/client/cookie-session.test.ts covers it. Drop the
  # patch once authsome's SDK has a cookie mode of its own.
  #
  # 1.8 fixed the other two changes this patch used to carry (the
  # client-config URL keeping authsome's /authsome base path, and the
  # cross-tab refresh lock), and ui-react 1.8 reads the paged organization
  # list, so its patch is gone too.
  "@authsome/ui-core@1.8.3": patches/@authsome__ui-core@1.8.3.patch
